function Chip({children, tone="default"}) {

}

function jenjangBreakdown(counts) {
  return JENJANG_ORDER.filter(j => counts[j]).map(j => ({ j, n: counts[j] }));

function MultiSelect({ options, selected, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const label = selected.length === 0 ? placeholder : (selected.length === 1 ? selected[0] : selected.length + " dipilih");
  const toggle = (opt) => {
    if (selected.includes(opt)) onChange(selected.filter(x=>x!==opt));
    else onChange([...selected, opt]);
  };
  return (
    <div style={{position:"relative"}}>
      <button type="button" onClick={()=>setOpen(o=>!o)}
        style={{...selectStyle, textAlign:"left", display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer"}}>
        <span style={{color: selected.length===0 ? "#8a7f6e" : INK}}>{label}</span>
        <ChevronDown size={14} color="#9b8f7c" />
      </button>
      {open && (
        <>
          <div onClick={()=>setOpen(false)} style={{position:"fixed", inset:0, zIndex:10}} />
          <div style={{position:"absolute", top:"calc(100% + 4px)", left:0, right:0, background:"#fff", border:"1px solid " + LINE, borderRadius:8, boxShadow:"0 8px 24px rgba(0,0,0,0.08)", zIndex:11, padding:6, maxHeight:220, overflowY:"auto"}}>
            {selected.length > 0 && (
              <div onClick={()=>onChange([])} style={{padding:"6px 8px", fontSize:11.5, color: RUST, cursor:"pointer", fontWeight:600}}>Bersihkan pilihan</div>
            )}
            {options.map(opt => (
              <label key={opt} style={{display:"flex", alignItems:"center", gap:8, padding:"6px 8px", fontSize:12.5, color: INK, cursor:"pointer", borderRadius:6}}
                onMouseDown={e=>e.preventDefault()}>
                <input type="checkbox" checked={selected.includes(opt)} onChange={()=>toggle(opt)} style={{cursor:"pointer"}} />
                {opt}
              </label>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function Page1() {
  const kabList = Object.keys(DATA.kab).sort();
  const [activeKab, setActiveKab] = useState("Semua Kabupaten/Kota");
  const [activeJenjangs, setActiveJenjangs] = useState([]);
  const [activeGelombangs, setActiveGelombangs] = useState([]);
  const [query, setQuery] = useState("");

  const kabTotals = useMemo(() => {
    return kabList.map(k => {
      const gugusList = DATA.kab[k];
      const total = gugusList.reduce((s,g)=>s+g.t,0);
      const gugusCount = gugusList.length;
      return { kab: k.replace("Kabupaten ","Kab. "), full: k, total, gugusCount };
    });
  }, [kabList]);

  const grandTotalSchools = kabTotals.reduce((s,k)=>s+k.total,0);
  const grandTotalGugus = kabTotals.reduce((s,k)=>s+k.gugusCount,0);

  const jenjangTotals = useMemo(()=>{
    const t = {};
    kabList.forEach(k => DATA.kab[k].forEach(g => {
      Object.entries(g.c).forEach(([j,n]) => { t[j]=(t[j]||0)+n; });
    }));
    return JENJANG_ORDER.filter(j=>t[j]).map(j=>({name:j, value:t[j]}));
  }, [kabList]);

  const allSchools = useMemo(() => {
    const rows = [];
    kabList.forEach(k => (DATA.kab[k]||[]).forEach(g => (g.schools||[]).forEach(s => {
      const tl = g.tl || {};
      rows.push({
        ...s, kab: k, gugus: g.g, gel: g.gel || null,
        spmiTgl: tl.bimtek_spmi_tgl || null,
        litTgl: tl.bimtek_lit_tgl || null,
        digTgl: tl.bimtek_dig_tgl || null,
      });
    })));
    return rows;
  }, [kabList]);

  const jenjangOptions = useMemo(() => JENJANG_ORDER.filter(j => allSchools.some(s=>s.jenjang===j)), [allSchools]);
  const gelombangOptions = useMemo(() => {
    const set = new Set(allSchools.map(s=>s.gel).filter(Boolean));
    return Array.from(set).sort((a,b) => {
      const na = parseInt((a.match(/\d+/)||[0])[0], 10);
      const nb = parseInt((b.match(/\d+/)||[0])[0], 10);
      return na - nb;
    });
  }, [allSchools]);

  const filteredSchools = useMemo(() => {
    let list = allSchools;
    if (activeKab !== "Semua Kabupaten/Kota") list = list.filter(s => s.kab === activeKab);
    if (activeJenjangs.length > 0) list = list.filter(s => activeJenjangs.includes(s.jenjang));
    if (activeGelombangs.length > 0) list = list.filter(s => activeGelombangs.includes(s.gel));
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(s => s.npsn.toLowerCase().includes(q));
    }
    return list;
  }, [allSchools, activeKab, activeJenjangs, activeGelombangs, query]);

  const exportExcel = () => {
    const headers = ["NPSN","Nama Sekolah","Gugus Belajar","Gelombang","Jadwal Bimtek SPMI","Jadwal Bimtek Litnum","Jadwal Bimtek Digitalisasi","Kecamatan","Penerima PID"];
    const rows = filteredSchools.map(s => [s.npsn, s.nama, s.gugus, s.gel||"", s.spmiTgl||"", s.litTgl||"", s.digTgl||"", s.kec, s.pid?"Ya":"Tidak"]);
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    ws["!cols"] = [ {wch:12},{wch:36},{wch:26},{wch:12},{wch:16},{wch:16},{wch:20},{wch:20},{wch:14} ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Sebaran Gugus");
    XLSX.writeFile(wb, "sebaran_gugus_bosp_" + new Date().toISOString().slice(0,10) + ".xlsx");
  };

  return (
    <div>
      <SectionLabel eyebrow="Peta Sebaran · 630 Satdik" title="Sebaran Gugus Belajar & Data Sekolah" sub="Kab/Kota, gugus belajar, dan komposisi jenjang penerima BOSP Kinerja Terbaik 2026 di seluruh Nusa Tenggara Barat." />

      <div style={{display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap: 14, marginBottom: 28}}>
        {[
          {label:"Total Satdik Penerima", value: grandTotalSchools, icon: School, tone:"rust"},
          {label:"Total Gugus Belajar", value: grandTotalGugus, icon: Layers, tone:"teal"},
          {label:"Kabupaten/Kota", value: kabList.length, icon: MapPin, tone:"gold"},
          {label:"Jenjang Terlibat", value: jenjangTotals.length, icon: GraduationCap, tone:"default"},
        ].map((s,i)=>(
          <div key={i} style={{background:"#fff", border:"1px solid " + LINE, borderRadius: 10, padding:"16px 18px", position:"relative", overflow:"hidden"}}>
            <div style={{position:"absolute", top:-14, right:-14, opacity:0.07}}><s.icon size={72} /></div>
            <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", color:"#8a7f6e"}}>{s.label}</div>
            <div style={{fontFamily:"'Fraunces', serif", fontSize:34, fontWeight:600, color: INK, marginTop:4}}>{s.value}</div>
          </div>
        ))}
      </div>

      <div style={{display:"grid", gridTemplateColumns:"1.3fr 1fr", gap: 20, marginBottom: 28}}>
        <div style={{background:"#fff", border:"1px solid " + LINE, borderRadius: 10, padding:20}}>
          <div style={{fontSize:13, fontWeight:700, color: INK, marginBottom:14}}>Jumlah Satdik per Kabupaten/Kota</div>
          <ResponsiveContainer width="100%" height={260}>
            <BarChart data={kabTotals} margin={{left:-16, right:8, top:4, bottom:4}}>
              <CartesianGrid strokeDasharray="2 4" stroke={LINE} vertical={false} />
              <XAxis dataKey="kab" tick={{fontSize:10, fill:"#6b6154"}} angle={-28} textAnchor="end" interval={0} height={62} />
              <YAxis tick={{fontSize:10, fill:"#6b6154"}} width={30} />
              <Tooltip contentStyle={{fontSize:12, borderRadius:8, border:"1px solid " + LINE}} cursor={{fill:"#f0e9da"}} />
              <Bar dataKey="total" radius={[5,5,0,0]}>
                {kabTotals.map((entry, i) => <Cell key={i} fill={entry.full===activeKab ? RUST : "#d9c9ae"} cursor="pointer" onClick={()=>setActiveKab(entry.full)} />)}
              </Bar>
            </BarChart>
          </ResponsiveContainer>
        </div>
        <div style={{background:"#fff", border:"1px solid " + LINE, borderRadius: 10, padding:20}}>
          <div style={{fontSize:13, fontWeight:700, color: INK, marginBottom:14}}>Komposisi Jenjang (Provinsi)</div>
          <ResponsiveContainer width="100%" height={260}>

function SchoolUploadForm({kab, gugus, sekolah}) {
  const storageKey = "tugas:" + kab + ":" + gugus.g + ":" + sekolah.npsn;
  const [rtlLink, setRtlLink] = useState("");
  const [bahanLink, setBahanLink] = useState("");
  const [pengirim, setPengirim] = useState("");
  const [saved, setSaved] = useState(null);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(false);
  const [status, setStatus] = useState("");

  useEffect(() => {
    let mounted = true;
    setLoading(true);
    setSaved(null);
    setEditing(false);
    (async () => {
      try {
        const raw = localStorage.getItem(storageKey); const res = raw ? { value: raw } : null;
        if (mounted && res && res.value) setSaved(JSON.parse(res.value));
      } catch (e) { /* belum ada data */ }
      if (mounted) setLoading(false);
    })();
    return () => { mounted = false; };
  }, [storageKey]);

  const submit = async () => {
    if (!rtlLink.trim() || !bahanLink.trim() || !pengirim.trim()) { setStatus("Isi nama pengunggah dan kedua link."); return; }
    setStatus("Menyimpan...");
    try {
      const payload = { pengirim: pengirim.trim(), rtlLink: rtlLink.trim(), bahanLink: bahanLink.trim(), waktu: new Date().toLocaleString("id-ID", { dateStyle:"medium", timeStyle:"short" }) };
      localStorage.setItem(storageKey, JSON.stringify(payload));
      setSaved(payload);
      setEditing(false);
      setStatus("");
      if (APPS_SCRIPT_URL) {
        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              kewenangan: gugus.j === "Dikmen" ? "Provinsi Nusa Tenggara Barat" : kab,
              kabupaten: kab,
              gugus: gugus.g,
              sekolah: sekolah.nama,
              rtlLink: rtlLink.trim(),
              bahanLink: bahanLink.trim(),
              pengirim: pengirim.trim(),
            }),
          });
        } catch (e) { /* sinkronisasi ke sheet gagal, data tetap tersimpan lokal */ }
      }
    } catch (e) {
      setStatus("Gagal menyimpan. Coba lagi.");
    }
  };

  if (loading) return <div style={{fontSize:12, color:"#a89e8c", padding:16}}>Memuat data...</div>;

  return (
    <div style={{border:"1px solid " + LINE, borderRadius:10, padding:"16px", background:"#fff"}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, flexWrap:"wrap", marginBottom:12}}>
        <div>
          <div style={{fontSize:14, fontWeight:700, color: INK}}>{sekolah.nama}</div>
          <div style={{fontSize:11.5, color:"#8a7f6e", marginTop:2}}>NPSN {sekolah.npsn} · {sekolah.kec} · Penyelenggara: satuan pendidikan</div>
        </div>
        {saved && !editing && <Chip tone="teal"><CheckCircle2 size={11} style={{verticalAlign:-2, marginRight:3}}/>Sudah mengunggah</Chip>}
        {!saved && !editing && <Chip tone="gold"><Clock size={11} style={{verticalAlign:-2, marginRight:3}}/>Belum mengunggah</Chip>}
      </div>

      {saved && !editing && (
        <div style={{background:"#fbf8f1", borderRadius:8, padding:"12px 14px", fontSize:12.5}}>
          <div style={{color: INK, marginBottom:6}}>Diunggah oleh <b>{saved.pengirim}</b> · {saved.waktu}</div>
          <div style={{display:"flex", flexDirection:"column", gap:5}}>
            <a href={saved.rtlLink} target="_blank" rel="noreferrer" style={{color: TEAL, wordBreak:"break-all", display:"inline-flex", alignItems:"center", gap:4}}>
              <LinkIcon size={12}/> Dokumen RTL: {saved.rtlLink}
            </a>
            <a href={saved.bahanLink} target="_blank" rel="noreferrer" style={{color: TEAL, wordBreak:"break-all", display:"inline-flex", alignItems:"center", gap:4}}>
              <LinkIcon size={12}/> Bahan/Hasil RTL: {saved.bahanLink}
            </a>
          </div>
          <div style={{marginTop:10}}>
            <button onClick={()=>{setEditing(true); setPengirim(saved.pengirim); setRtlLink(saved.rtlLink); setBahanLink(saved.bahanLink);}} style={btnGhost}>Perbarui link</button>
          </div>
        </div>
      )}

      {(!saved || editing) && (
        <div style={{display:"flex", flexDirection:"column", gap:8}}>
          <input value={pengirim} onChange={e=>setPengirim(e.target.value)} placeholder="Nama pengunggah (perwakilan satuan pendidikan)" style={inputStyle} />
          <input value={rtlLink} onChange={e=>setRtlLink(e.target.value)} placeholder="Link Dokumen RTL" style={inputStyle} />
          <input value={bahanLink} onChange={e=>setBahanLink(e.target.value)} placeholder="Link Bahan/Hasil dari RTL tersebut" style={inputStyle} />
          <div style={{display:"flex", gap:8, alignItems:"center"}}>
            <button onClick={submit} style={btnPrimary}><Upload size={12} style={{verticalAlign:-2, marginRight:5}}/>Kirim</button>
            {editing && <button onClick={()=>setEditing(false)} style={btnGhost}>Batal</button>}
            {status && <span style={{fontSize:11.5, color: (status.indexOf("Gagal")>=0||status.indexOf("Isi")>=0) ? RUST : "#8a7f6e"}}>{status}</span>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- ROOT ---------------- */
function computeMetaFromData(json) {
  let totalSekolah = 0, totalGugus = 0;
  Object.values(json.kab).forEach(list => { totalGugus += list.length; list.forEach(g => totalSekolah += (g.t||0)); });
  return { totalSekolah, totalGugus, totalKab: Object.keys(json.kab).length, generatedAt: json.generatedAt || null };
}

  const [page, setPage] = useState(1);
  const [status, setStatus] = useState("ready"); // ready | loading | error

  const [meta, setMeta] = useState(computeMetaFromData(DATA));

  const loadData = () => {
    if (!APPS_SCRIPT_URL) return;
    setStatus("loading");
    fetch(APPS_SCRIPT_URL)
      .then(r => r.json())
      .then(json => {
        if (!json || !json.kab) throw new Error("Format data tidak sesuai");
        DATA = json;
        setMeta(computeMetaFromData(json));
        setStatus("ready");
        setTick(t => t + 1);
      })
      .catch(() => setStatus("error"));
  };

  const pages = [
    { id:1, label:"Sebaran Gugus", icon: LayoutGrid },
    { id:2, label:"Jadwal & Fasda", icon: Calendar },
    { id:3, label:"Pelaksanaan & Tugas", icon: ListChecks },
  ];

  return (
    <div style={{minHeight:"100vh", background: PAPER, fontFamily:"'Inter', ui-sans-serif, system-ui", color: INK}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; height:8px; }
        ::-webkit-scrollbar-thumb { background: #d8cdb8; border-radius: 8px; }
        button:focus-visible, input:focus-visible { outline: 2px solid #b5502f; outline-offset: 1px; }
      `}</style>

      <div style={{borderBottom:"1px solid " + LINE, background:"#fbf8f1"}}>
        <div style={{maxWidth: 1180, margin:"0 auto", padding:"22px 28px 0"}}>
          <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap: 12}}>
            <div>
              <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.16em", textTransform:"uppercase", color: RUST}}>BPMP Provinsi Nusa Tenggara Barat</div>
              <h1 style={{fontFamily:"'Fraunces', serif", fontSize:26, fontWeight:600, margin:"4px 0 0"}}>Dasbor BOSP Kinerja Terbaik 2026</h1>
            </div>
            <div style={{display:"flex", gap:16, fontSize:12, color:"#6b6154", alignItems:"center"}}>
              <div><b style={{color:INK}}>{meta.totalSekolah}</b> Satdik</div>
              <div><b style={{color:INK}}>{meta.totalGugus}</b> Gugus</div>
              <div><b style={{color:INK}}>{meta.totalKab}</b> Kab/Kota</div>
              {status === "loading" && <span style={{fontSize:11, color:"#8a7f6e"}}>Memuat…</span>}
              {status === "error" && <span style={{fontSize:11, color: RUST}}>Gagal memuat data terbaru</span>}
              <button onClick={loadData} disabled={status==="loading"} title={APPS_SCRIPT_URL ? "Muat ulang data dari Google Sheets" : "Tempel APPS_SCRIPT_URL di kode untuk mengaktifkan data live"}
                style={{background:"transparent", border:"1px solid " + LINE, borderRadius:7, padding:"5px 10px", fontSize:11.5, fontWeight:600, color:"#6b6154", cursor: status==="loading" ? "default" : "pointer", opacity: status==="loading" ? 0.6 : 1}}>
                ⟳ Segarkan
              </button>
            </div>
          </div>
          <div style={{display:"flex", gap: 4, marginTop: 20}}>
            {pages.map(p => (
              <button key={p.id} onClick={()=>setPage(p.id)}
                style={{
                  display:"flex", alignItems:"center", gap:7,
                  padding:"10px 16px", fontSize:13, fontWeight:600, cursor:"pointer",
                  background:"transparent", border:"none",
                  borderBottom: page===p.id ? "2.5px solid #b5502f" : "2.5px solid transparent",
                  color: page===p.id ? INK : "#8a7f6e",
                }}>
                <p.icon size={15} />
                {p.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div style={{maxWidth: 1180, margin:"0 auto", padding:"28px"}} key={tick}>
        {page===1 && <Page1 />}
        {page===2 && <Page2 />}
        {page===3 && <Page3 />}
      </div>

      <div style={{textAlign:"center", fontSize:11, color:"#a89e8c", padding:"18px 0 32px"}}>
        Program BOSP Kinerja Terbaik Tahun 2026 · Kemendikdasmen · {meta.generatedAt ? "Data live dari Google Sheets" : "Data per Agustus 2026"}
      </div>
    </div>
  );
}


const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(React.createElement(App));

</script>
</body>
</html>
